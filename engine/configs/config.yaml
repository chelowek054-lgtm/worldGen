# Корневой Hydra-конфиг. Принцип: один конфиг → один прогон → залогированные метрики.
defaults:
  - tracking: mlflow
  - _self_

# Глобальный seed — фиксируется во всех источниках случайности (см. worldgen/seed.py).
seed: 1234

# Имя прогона (используется трекером и путями артефактов).
run_name: smoke

# Параметры заглушки-эксперимента (заменяется реальной оценкой в фазах 0.1+).
experiment:
  n: 100000

hydra:
  job:
    # Не менять рабочую директорию — пути артефактов резолвятся от корня engine/.
    chdir: false
  run:
    dir: runs/hydra/${run_name}
  sweep:
    dir: runs/hydra/${run_name}
    subdir: ${hydra.job.num}
