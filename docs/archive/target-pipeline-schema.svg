<svg width="680" height="524" viewBox="0 0 680 524" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Схема пайплайна World-Gen: поток данных от входа через базу ассетов, идентификацию и физику к рендеру</title>
<desc>Входные данные (раскладка, ID объектов, JSON физики) поступают в блок идентификации и композиции, который также забирает готовые ДНК объектов и персонажей из базы ассетов. Собранная сцена передаётся в блок просчёта физики, оттуда — в рендер, который выдаёт изображение или видеоряд.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="524" fill="#ffffff"/>

<rect x="40" y="10" width="10" height="10" fill="#888780"/>
<text x="56" y="19" font-family="sans-serif" font-size="12" fill="#3d3d3a">структура</text>
<rect x="170" y="10" width="10" height="10" fill="#534AB7"/>
<text x="186" y="19" font-family="sans-serif" font-size="12" fill="#3d3d3a">база ассетов</text>
<rect x="320" y="10" width="10" height="10" fill="#0F6E56"/>
<text x="336" y="19" font-family="sans-serif" font-size="12" fill="#3d3d3a">ось A</text>
<rect x="420" y="10" width="10" height="10" fill="#993C1D"/>
<text x="436" y="19" font-family="sans-serif" font-size="12" fill="#3d3d3a">ось B</text>

<line x1="440" y1="96" x2="440" y2="140" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="260" y1="168" x2="280" y2="168" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="440" y1="196" x2="440" y2="240" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="440" y1="296" x2="440" y2="340" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="440" y1="396" x2="355" y2="440" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="440" y1="396" x2="525" y2="440" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
  <rect x="280" y="40" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="440" y="63" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Входные данные</text>
  <text x="440" y="83" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">раскладка, ID ассетов, JSON физики</text>
</g>

<g>
  <rect x="80" y="140" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="170" y="163" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">База ассетов</text>
  <text x="170" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">объекты и персонажи</text>
</g>

<g>
  <rect x="280" y="140" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="440" y="163" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Идентификация и композиция</text>
  <text x="440" y="183" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">ДНК + поза + раскладка → сцена</text>
</g>

<g>
  <rect x="280" y="240" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="440" y="263" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Просчёт физики</text>
  <text x="440" y="283" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">граф контактов, переход fθ</text>
</g>

<g>
  <rect x="280" y="340" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="440" y="363" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Рендер</text>
  <text x="440" y="383" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">замороженный генератор</text>
</g>

<g>
  <rect x="280" y="440" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="355" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Изображение</text>
</g>

<g>
  <rect x="450" y="440" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="525" y="466" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Видеоряд</text>
</g>
</svg>
